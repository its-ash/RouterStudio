[package]
name = "openagent"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
image = { version = "0.25", features = ["png", "jpeg"] }
poll-promise = "0.3"
futures-util = "0.3"
anyhow = "1.0"
dirs = "5.0"
urlencoding = "2.1"
rfd = "0.15"
